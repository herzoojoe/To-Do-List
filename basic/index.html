<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tasks</title>
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    var saved = localStorage.getItem("basic_theme");
    var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>
  <div class="app">
    <div class="header-top">
      <h1>My Tasks</h1>
      <button type="button" id="themeToggle" class="theme-toggle" aria-label="다크 모드 전환">
        <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>

    <section class="dashboard" id="dashboard">
      <div class="dashboard-overall">
        <span class="dashboard-overall-label">전체 진행률</span>
        <span class="dashboard-overall-count" id="overallCount">0 / 0</span>
        <div class="bar-track">
          <div class="bar-fill" id="overallFill"></div>
        </div>
        <span class="dashboard-overall-percent" id="overallPercent">0%</span>
      </div>
      <div class="dashboard-categories" id="dashboardCategories"></div>
    </section>

    <form class="add-form" id="addForm">
      <input
        type="text"
        id="todoInput"
        placeholder="할 일을 입력하세요"
        autocomplete="off"
        maxlength="200"
        aria-label="할 일 입력"
      >
      <select id="categorySelect" aria-label="카테고리 선택">
        <option value="work">업무</option>
        <option value="personal">개인</option>
        <option value="study">공부</option>
      </select>
      <button type="submit">추가</button>
    </form>

    <nav class="filter-tabs" id="filterTabs">
      <button type="button" class="filter-tab" data-filter="all">전체</button>
      <button type="button" class="filter-tab" data-filter="work">업무</button>
      <button type="button" class="filter-tab" data-filter="personal">개인</button>
      <button type="button" class="filter-tab" data-filter="study">공부</button>
    </nav>

    <ul class="todo-list" id="todoList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
